name: R4B compile check

# Roadmap item 0.4: proves the Cassandra backend assumes nothing R4-specific
# by compiling helios-persistence with R4B as the only FHIR version. Runs on
# the team's self-hosted runner (ADR-aacruzgon-0018, ADR-sam-michaels-0001).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a newer push supersedes the run in flight.
concurrency:
  group: r4b-compile-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned by environment, which rustup ranks above any directory override left
  # on the runner (the inherited ci.yml hit exactly that). Cargo itself refuses
  # a toolchain older than the workspace rust-version, 1.90.
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:
  r4b-check:
    name: cargo check (cassandra, R4B)
    # Fork guard (ADR-aacruzgon-0018). It only keeps this unmodified workflow
    # from running a fork's code; approval is what keeps forks off the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, hfs-cassandra]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # rustup and its proxies live in ~/.cargo/bin on this runner; never
          # restore them from a cache.
          cache-bin: "false"

      - name: cargo check -p helios-persistence --no-default-features --features cassandra,R4B
        run: cargo check -p helios-persistence --no-default-features --features cassandra,R4B
