name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_MIN_STACK: 8388608
  RUSTFLAGS: -C linker=clang -C link-arg=-fuse-ld=lld

jobs:
  coverage:
    name: Rust coverage (R4 / SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Generate coverage
        # Measure the default R4 / SQLite build. Optional storage backends
        # require separate integration coverage; pysof has its own Python setup.
        # Exclude generated FHIR models before upload to keep LCOV manageable.
        # SMTP integration coverage remains in the archived channel workflow.
        run: >-
          cargo llvm-cov --locked --workspace --exclude pysof
          --lcov --output-path lcov.info
          --ignore-filename-regex 'crates/fhir/src/r(4|4b|5|6)\.rs$'
          -- --skip email_

      - name: Save coverage report
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          # Fork PRs cannot access this secret and use Codecov's public
          # repository tokenless upload support instead.
          token: ${{ secrets.CODECOV_TOKEN }}
