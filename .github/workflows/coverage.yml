name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_MIN_STACK: 8388608
  RUSTFLAGS: -C linker=clang -C link-arg=-fuse-ld=lld

jobs:
  coverage:
    name: Rust coverage (R4 / SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang lld pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Generate coverage
        # Measure the default R4 / SQLite build. Optional storage backends
        # require separate integration coverage; pysof has its own Python setup.
        # Exclude generated FHIR models before upload to keep LCOV manageable.
        # SMTP integration coverage remains in the archived channel workflow.
        run: >-
          cargo llvm-cov --locked --workspace --exclude pysof
          --lcov --output-path lcov.info
          --ignore-filename-regex 'crates/fhir/src/r(4|4b|5|6)\.rs$'
          -- --skip email_

      - name: Save coverage report
        if: ${{ !cancelled() && hashFiles('lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true
          # Fork PRs cannot access this secret and use Codecov's public
          # repository tokenless upload support instead.
          token: ${{ secrets.CODECOV_TOKEN }}
